name: sunflower_flutter
description: >
  A Flutter port of the Android Sunflower gardening app. Demonstrates Flutter
  best practices including Material 3, feature-based architecture, drift
  database, go_router navigation, and get_it dependency injection.
version: 0.1.6+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI & Material 3 ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # --- State management ---
  provider: ^6.1.2

  # --- Navigation ---
  go_router: ^14.2.0

  # --- Local database (drift / SQLite) ---
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Dependency injection ---
  get_it: ^7.7.0

  # --- HTTP client ---
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # --- Serialization ---
  json_annotation: ^4.9.0

  # --- Utilities ---
  intl: ^0.19.0
  equatable: ^2.0.5
  rxdart: ^0.27.7

# ---------------------------------------------------------------------------
# Dev / build-time dependencies
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Integration testing ---
  integration_test:
    sdk: flutter

  # --- Code generation ---
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0

  # --- Testing ---
  mockito: ^5.4.4
  mocktail: ^1.0.4
  fake_async: ^1.3.1

  # --- Coverage ---
  coverage: ^1.7.2

# ---------------------------------------------------------------------------
# Flutter configuration
# ---------------------------------------------------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/plants.json
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic

# ---------------------------------------------------------------------------
# build_runner / code-gen configuration
# ---------------------------------------------------------------------------
# Run code generation with:
#   flutter pub run build_runner build --delete-conflicting-outputs
# Or watch mode:
#   flutter pub run build_runner watch --delete-conflicting-outputs
