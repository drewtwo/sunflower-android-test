# Coverage Reporting Workflow
#
# Runs on every PR and main branch push to collect coverage data and
# upload to Codecov. Enforces a minimum 60% coverage threshold.

name: Coverage

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'

jobs:
  coverage:
    name: Collect & Report Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage --coverage-path=coverage/lcov.info

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Filter coverage (exclude generated files)
        run: |
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/generated/**' \
            --output-file coverage/lcov_filtered.info

      - name: Generate coverage summary
        run: |
          lcov --summary coverage/lcov_filtered.info

      - name: Check minimum coverage threshold (60%)
        run: |
          COVERAGE=$(lcov --summary coverage/lcov_filtered.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the minimum threshold of 60%"
            exit 1
          fi
          echo "::notice::Coverage ${COVERAGE}% meets the 60% threshold ✅"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov_filtered.info
          flags: flutter
          name: sunflower-flutter
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate HTML report
        run: genhtml coverage/lcov_filtered.info --output-directory coverage/html

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage/html/
          retention-days: 30

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const summary = execSync('lcov --summary coverage/lcov_filtered.info 2>&1').toString();
            const match = summary.match(/lines\.*: (\d+\.\d+)%/);
            const coverage = match ? match[1] : 'unknown';
            const emoji = parseFloat(coverage) >= 60 ? '✅' : '❌';
            const body = `## ${emoji} Flutter Test Coverage: ${coverage}%\n\n` +
              `Coverage threshold: 60%\n\n` +
              `\`\`\`\n${summary}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
